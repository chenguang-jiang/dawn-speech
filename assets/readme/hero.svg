<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">dawn-speech — 自然、清楚、有依据的写作技能</title>
  <desc id="desc">暖白色编辑稿上的 dawn-speech 标题。橙色校订线强调从保留事实、理清关系到自然表达的写作过程，适用于中文和英文的文章、口播与演讲。</desc>
  <rect width="1200" height="410" fill="#F7F4ED"/>
  <g id="editorial-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#242A29">
    <text x="64" y="57" font-size="20" letter-spacing="2" fill="#656B65">A WRITING SKILL / 中文 · ENGLISH</text>
    <text x="59" y="162" font-size="94" font-weight="650" letter-spacing="-4">dawn-speech</text>
    <text x="64" y="231" font-size="42" font-weight="450">让文章与口播，自然、清楚、有依据。</text>
    <path d="M 65 248 C 190 245 286 250 365 246" fill="none" stroke="#B64A2E" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g id="editing-sequence" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#242A29">
    <path d="M 64 288 H 1136" stroke="#D4D5CD" stroke-width="1.5"/>
    <text x="64" y="354" font-size="34">保留事实</text>
    <text x="465" y="354" font-size="34">理清关系</text>
    <text x="866" y="354" font-size="34">自然表达</text>
    <g fill="none" stroke="#B64A2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 295 342 H 385 M 375 334 L 385 342 L 375 350"/>
      <path d="M 696 342 H 786 M 776 334 L 786 342 L 776 350"/>
    </g>
  </g>
</svg>
